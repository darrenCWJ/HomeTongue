<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="100" height="100" rx="22" fill="url(#grad)"/>
  <!-- Roof triangle -->
  <polygon points="50,12 82,42 18,42" fill="white"/>
  <!-- Speech bubble body (overlaps roof base) -->
  <rect x="18" y="40" width="64" height="32" rx="12" fill="white"/>
  <!-- Speech bubble tail (bottom-left) -->
  <polygon points="30,72 20,87 50,72" fill="white"/>
  <!-- Speech lines (language / tongue symbolism) -->
  <line x1="30" y1="51" x2="70" y2="51" stroke="#4F46E5" stroke-width="4" stroke-linecap="round"/>
  <line x1="30" y1="62" x2="55" y2="62" stroke="#4F46E5" stroke-width="4" stroke-linecap="round"/>
</svg>
