# Codemagic CI — iOS build for the Capacitor app.
#
# ⚠️ NOT RUNNABLE AS-IS. This workflow is a configured skeleton: it needs the
# user's Apple Developer account wired into Codemagic before it can produce a
# signed IPA. Until then it documents the exact build sequence a Mac (local or
# Codemagic's) must run.
#
# One-time setup (docs: https://docs.codemagic.io/yaml-quick-start/building-a-capacitor-app/):
#   1. Connect this repo in the Codemagic dashboard.
#   2. App Store Connect integration: create an App Store Connect API key
#      (App Store Connect → Users and Access → Integrations) and add it in
#      Codemagic → Teams → Integrations, then reference its name below under
#      `integrations.app_store_connect`.
#      https://docs.codemagic.io/yaml-code-signing/signing-ios/
#   3. Register the bundle id com.hometongue.app in the Apple Developer portal
#      and create the app record in App Store Connect.
#   4. Set the environment group "hometongue" in Codemagic UI with:
#        VITE_API_BASE_URL  (e.g. https://home-tongue.vercel.app)
#
# The iOS project uses Swift Package Manager (Capacitor 8 default) — there is
# no CocoaPods step.

workflows:
  ios-workflow:
    name: iOS Capacitor build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - hometongue # must define VITE_API_BASE_URL (set in Codemagic UI)
      node: 22
      xcode: latest
      vars:
        BUNDLE_ID: com.hometongue.app
        XCODE_WORKSPACE: ios/App/App.xcodeproj # SPM project — no .xcworkspace
        XCODE_SCHEME: App
      # ── Signing placeholder ──────────────────────────────────────────────
      # Uncomment once the App Store Connect integration (named
      # "hometongue-asc" here) exists in Codemagic → Teams → Integrations:
      #
      # ios_signing:
      #   distribution_type: app_store # or: ad_hoc | development
      #   bundle_identifier: com.hometongue.app
    # integrations:
    #   app_store_connect: hometongue-asc
    scripts:
      - name: Install dependencies
        script: |
          npm install -g pnpm@10
          pnpm install --frozen-lockfile
      - name: Build web assets (API origin baked in — required for the webview)
        script: |
          pnpm build
        # VITE_API_BASE_URL comes from the "hometongue" environment group.
      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios
      # Signed builds also need profiles applied before archiving:
      # - name: Set up code signing
      #   script: |
      #     xcode-project use-profiles
      - name: Build IPA
        script: |
          # Without signing configured this archive step will fail at the
          # signing phase — expected until the setup steps above are done.
          xcode-project build-ipa \
            --project "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # publishing:
    #   app_store_connect:
    #     auth: integration
    #     submit_to_testflight: true
